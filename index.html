<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDR2 · Seguimiento de Caza y Crafteo</title>
<style>
  :root{
    --bg:#14100c; --bg2:#1c1712; --panel:#221b14; --panel2:#2a2119;
    --line:#3a2f24; --ink:#e9ddca; --muted:#a08d73; --gold:#c8a24a;
    --red:#a3352b; --green:#5f7d3a; --greenbright:#8fbf4d; --blue:#5b8aa6;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(200,162,74,.06), transparent 60%),var(--bg);
    color:var(--ink);font-family:"Georgia","Times New Roman",serif;font-size:15px;line-height:1.4;
    -webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;
  }
  a{color:var(--gold)}
  .wrap{max-width:1600px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 18px 10px}

  header.app{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--line)}
  header.app h1{font-size:21px;margin:0;letter-spacing:.5px;color:var(--gold);text-shadow:0 2px 0 #000}
  header.app .sub{color:var(--muted);font-size:12px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
  .btn:hover{border-color:var(--gold)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px}
  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .stat .num{font-size:18px;color:var(--gold);margin:3px 0 6px}
  .bar{height:6px;background:#000;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--greenbright))}

  /* two independent-scroll panels */
  .panels{flex:1;min-height:0;display:flex;gap:16px}
  .panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .phead{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .phead .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .phead h2{font-size:16px;color:var(--gold);margin:0;letter-spacing:.5px}
  .phead .row1 .cnt{font-size:12px;color:var(--muted)}
  .phead .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search],select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:7px;font-family:inherit;font-size:13px}
  input[type=search]{flex:1;min-width:120px}
  label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none;font-size:13px;white-space:nowrap}
  label.chk input{width:15px;height:15px;accent-color:var(--gold)}
  .pbody{flex:1;overflow-y:auto;padding:12px 14px}
  .pbody::-webkit-scrollbar{width:11px}
  .pbody::-webkit-scrollbar-thumb{background:#3a2f24;border-radius:99px;border:2px solid var(--bg2)}
  .pbody::-webkit-scrollbar-track{background:transparent}

  section.group{margin-bottom:18px}
  section.group > h3{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 10px;display:flex;justify-content:space-between}
  section.group > h3 .c{color:var(--muted);font-weight:normal}

  /* animal cards */
  .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;display:flex;gap:10px;align-items:center;transition:.12s}
  .card.done{background:var(--panel2);border-color:var(--green)}
  .card .body{flex:1;min-width:0}
  .card .name{font-size:14px;color:var(--ink)}
  .card.done .name{color:var(--greenbright)}
  .card .meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
  .tag{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
  .tag.leg{border-color:var(--gold);color:var(--gold)}
  .counter{display:flex;align-items:center;gap:2px;flex:none}
  .counter button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
  .counter button:hover{border-color:var(--gold);color:var(--gold)}
  .catchbtn{flex:none;padding:6px 10px;font-size:12px;white-space:nowrap}
  .catchbtn:hover{border-color:var(--gold);color:var(--gold)}
  .card .badge.done{flex:none}
  .counter .q{min-width:22px;text-align:center;font-size:15px;color:var(--muted)}
  .card.done .counter .q{color:var(--greenbright);font-weight:bold}

  /* item list rows */
  .item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
  .item.bought{background:var(--panel2);border-color:var(--gold);opacity:.72}
  .item.ready{border-left:4px solid var(--greenbright)}
  .item .main{flex:1;min-width:0}
  .item .title{font-size:14px;color:var(--gold)}
  .item.bought .title{color:var(--muted);text-decoration:line-through}
  .item .subtitle{font-size:11px;color:var(--muted);margin:1px 0 6px}
  .ings{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 7px;color:var(--muted)}
  .chip .dot{width:8px;height:8px;border-radius:99px;flex:none;background:var(--red)}
  .chip.have{color:var(--greenbright);border-color:var(--green)}
  .chip.have .dot{background:var(--greenbright)}
  .chip.neutral{color:var(--muted);border-style:dashed;opacity:.8}
  .chip.neutral .dot{background:var(--muted)}
  .chip.clk{cursor:pointer}
  .chip.clk:hover{border-color:var(--gold);color:var(--gold)}
  .chip.clk:hover .dot{background:var(--gold)}
  .card.flash{animation:cardflash 1.5s ease}
  @keyframes cardflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(200,162,74,.55)}}
  .chip .qty{opacity:.7;font-size:10px}
  .item .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  .badge{font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .badge.ready{background:var(--green);color:#eaf5d8}
  .badge.wait{background:#3a2f24;color:var(--muted)}
  .buybtn{padding:6px 14px;font-size:12px}
  .buybtn:not([disabled]){border-color:var(--gold);color:var(--gold)}
  .buybtn:not([disabled]):hover{background:var(--gold);color:#241a08}
  .buybtn[disabled]{opacity:.35;cursor:not-allowed}
  .uncertain{color:var(--red);font-size:10px;font-style:italic;margin-top:5px}
  .empty{color:var(--muted);text-align:center;padding:30px;font-style:italic}
  .mapbtn{flex:none;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;margin-right:4px;line-height:1}
  .mapbtn:hover{border-color:var(--blue);background:#20323d}
  .mapmodal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:50;padding:4vh 4vw}
  .mapmodal.open{display:flex;flex-direction:column}
  .mapmodal .mm-head{display:flex;align-items:center;gap:14px;padding:6px 2px 12px}
  .mapmodal .mm-head h3{margin:0;font-size:19px;color:var(--gold);flex:1}
  .mm-body{flex:1;display:flex;gap:18px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px}
  .mm-map{flex:1.6;min-width:0;display:flex;flex-direction:column;gap:6px}
  .mapwrap{flex:1;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#c9b899;cursor:grab;touch-action:none}
  .mapwrap.grabbing{cursor:grabbing}
  .mapcanvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .mapcanvas .basemap{display:block;width:1000px;height:auto;user-select:none;-webkit-user-drag:none}
  .pinlayer{position:absolute;inset:0;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
  .pin .halo{width:var(--halo,60px);height:var(--halo,60px);border-radius:50%;background:radial-gradient(circle,rgba(143,191,77,.45),rgba(143,191,77,.12) 60%,transparent 72%);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .pin .dot{width:12px;height:12px;border-radius:50%;background:var(--greenbright);border:2px solid #24310a;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
  .pin .plbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-170%);white-space:nowrap;font-size:11px;font-weight:bold;color:#eaf7d4;text-shadow:0 1px 3px #000,0 0 4px #000;font-family:Georgia,serif}
  .mapcredit{font-size:10px;color:var(--muted);text-align:right}
  .mapzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
  .mapzoom button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:rgba(28,23,18,.9);color:var(--ink);font-size:17px;cursor:pointer;line-height:1}
  .mapzoom button:hover{border-color:var(--gold);color:var(--gold)}
  .mm-info{flex:.7;min-width:210px;max-width:280px;display:flex;flex-direction:column;gap:13px;overflow:auto}
  .mm-row .mm-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
  .mm-row div,.mm-row ul{color:var(--ink);font-size:14px}
  .mm-info ul{margin:0;padding-left:18px}
  .mm-info ul li{margin-bottom:2px}
  .mm-info a.mm-open{color:var(--blue);font-size:12px;text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:7px;text-align:center;margin-top:auto}
  .mm-info a.mm-open:hover{border-color:var(--blue)}
  @media(max-width:820px){ .mm-body{flex-direction:column} .mm-map{min-height:45vh} .mm-info{max-width:none} }

  @media (max-width:900px){
    body{overflow:auto;height:auto}
    .wrap{height:auto}
    .panels{flex-direction:column}
    .panel{height:70vh}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div style="flex:1">
      <h1>🦬 RDR2 · Seguimiento de Caza y Crafteo</h1>
      <div class="sub">Sumá lo que cazás y marcá lo que comprás. Todo se guarda en este navegador.</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="btnExport">Exportar</button>
      <button class="btn" id="btnImport">Importar</button>
      <button class="btn" id="btnReset">Reset</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panels">
    <!-- ANIMALES -->
    <div class="panel">
      <div class="phead">
        <div class="row1"><h2>🐾 Animales</h2><span class="cnt" id="animalsCnt"></span></div>
        <div class="ctrls">
          <input type="search" id="aSearch" placeholder="Buscar animal…">
          <select id="aCat"></select>
          <label class="chk"><input type="checkbox" id="aMissing"> Solo pendientes</label>
        </div>
      </div>
      <div class="pbody" id="animalsBody"></div>
    </div>

    <!-- ITEMS -->
    <div class="panel">
      <div class="phead">
        <div class="row1"><h2>🧵 Ítems para craftear / comprar</h2><span class="cnt" id="itemsCnt"></span></div>
        <div class="ctrls">
          <input type="search" id="iSearch" placeholder="Buscar ítem…">
          <select id="iSrc"></select>
          <label class="chk"><input type="checkbox" id="iReady"> Solo craftéables ya</label>
          <label class="chk"><input type="checkbox" id="iMissing"> Ocultar comprados</label>
        </div>
      </div>
      <div class="pbody" id="itemsBody"></div>
    </div>
  </div>
</div>

<div class="mapmodal" id="mapModal">
  <div class="mm-head">
    <h3 id="mmTitle">Zona</h3>
    <button class="btn" id="mmClose">Cerrar ✕</button>
  </div>
  <div class="mm-body">
    <div class="mm-map">
      <div class="mapwrap" id="mapWrap">
        <div class="mapcanvas" id="mapCanvas">
          <img class="basemap" id="baseMap" src="map_med_res.jpg" alt="Mapa de Red Dead Redemption 2" draggable="false">
        </div>
        <div class="pinlayer" id="pinLayer"></div>
        <div class="mapzoom">
          <button type="button" id="mzIn" title="Acercar">+</button>
          <button type="button" id="mzOut" title="Alejar">−</button>
          <button type="button" id="mzFit" title="Ver todo" style="font-size:12px">⤢</button>
        </div>
      </div>
      <div class="mapcredit">Mapa base por <a href="https://www.reddit.com/r/reddeadredemption2/comments/zwwcz6/" target="_blank" rel="noopener" style="color:inherit">u/Te_Quiero_Puta (r/reddeadredemption2)</a> · RDR2 © Rockstar Games · guía fan sin fines de lucro</div>
    </div>
    <div class="mm-info" id="mmInfo"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

const STORAGE_KEY="rdr2-tracker-v1";
let state=loadState();
const ui={aQ:"",aCat:"all",aMissing:false,iQ:"",iSrc:"all",iReady:false,iMissing:false};

function loadState(){
  let s; try{ s=JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
  if(!s||typeof s!=="object") s={};
  if(!s.animals) s.animals={}; if(!s.items) s.items={}; if(!s.obtained) s.obtained={};
  for(const k in s.animals){ if(s.animals[k]===true) s.animals[k]=1; s.animals[k]=Number(s.animals[k])||0; if(s.animals[k]<=0) delete s.animals[k]; }
  // compendio permanente: si hay stock (o venía de una versión vieja) queda como obtenido
  for(const k in s.animals){ if(s.animals[k]>0) s.obtained[k]=true; }
  return s;
}
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }

function allAnimals(){ return [...DATA.animals.map(a=>({...a,legendary:false})), ...DATA.legendaryAnimals.map(a=>({...a,legendary:true,category:"Legendary"}))]; }
function animalById(id){ return allAnimals().find(a=>a.id===id); }
function count(id){ return state.animals[id]||0; }
function obtained(id){ return !!state.obtained[id]; }
function animalDone(id){ return obtained(id); } // compendio: logro permanente
const LEG=new Set(DATA.legendaryAnimals.map(a=>a.id));
function isLeg(id){ return LEG.has(id); } // legendario: se caza 1 vez y habilita TODOS sus items (no se consume)
function anyObtainedInCat(cat){ return DATA.animals.some(a=>a.category===cat&&obtained(a.id)); }
function ingKind(ing){ return ing.animalId?'animal':ing.category?'cat':'other'; }
function ingHave(ing){ const k=ingKind(ing); return k==='animal'?obtained(ing.animalId):k==='cat'?anyObtainedInCat(ing.category):null; } // null = no cazable (neutro)
function ingHuntable(ing){ return ingKind(ing)!=='other'; }
function allItems(){
  const tag=(arr,src)=>(arr||[]).map(i=>({...i,source:src}));
  return [...tag(DATA.trapper,"Trapper"),...tag(DATA.pearson,"Pearson"),...tag(DATA.camp,"Campamento"),...tag(DATA.fence,"Fence"),...tag(DATA.challengeOutfits,"Retos / Legendario")];
}
function itemBought(id){ return !!state.items[id]; }
function concreteIngs(i){ return (i.ingredients||[]).filter(g=>g.animalId); } // materiales de un animal puntual (se descuentan)
function itemGated(i){ return (i.ingredients||[]).some(g=>g.animalId||g.category); } // tiene condición rastreable
function itemReady(i){ return (i.ingredients||[]).every(g=> g.animalId ? (isLeg(g.animalId) ? obtained(g.animalId) : count(g.animalId)>=g.qty) : g.category ? anyObtainedInCat(g.category) : true ); }

/* ---------- stats ---------- */
function renderStats(){
  const std=DATA.animals.length, stdDone=DATA.animals.filter(a=>animalDone(a.id)).length;
  const leg=DATA.legendaryAnimals.length, legDone=DATA.legendaryAnimals.filter(a=>animalDone(a.id)).length;
  const items=allItems(), itemsDone=items.filter(i=>itemBought(i.id)).length;
  const blocks=[
    {lbl:"Compendio",n:stdDone,d:std},
    {lbl:"Legendarios",n:legDone,d:leg},
    {lbl:"Ítems comprados",n:itemsDone,d:items.length},
    {lbl:"Trapper",n:(DATA.trapper||[]).filter(i=>itemBought(i.id)).length,d:(DATA.trapper||[]).length},
    {lbl:"Pearson",n:(DATA.pearson||[]).filter(i=>itemBought(i.id)).length,d:(DATA.pearson||[]).length},
    {lbl:"Campamento",n:(DATA.camp||[]).filter(i=>itemBought(i.id)).length,d:(DATA.camp||[]).length},
    {lbl:"Fence",n:(DATA.fence||[]).filter(i=>itemBought(i.id)).length,d:(DATA.fence||[]).length},
  ];
  document.getElementById("stats").innerHTML=blocks.map(b=>{
    const pct=b.d?Math.round(b.n/b.d*100):0;
    return `<div class="stat"><div class="lbl">${b.lbl}</div><div class="num">${b.n}/${b.d} <span style="font-size:12px;color:var(--muted)">${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function renderAnimals(){

function animalCard(a){
  const n=count(a.id), done=obtained(a.id), parts=(a.parts||[]).join(" · ");
  return `<div class="card ${done?'done':''}" data-id="${a.id}">
    <div class="body">

      : `<div class="counter">
      <button data-dec="${a.id}" title="Restar">−</button>
      <span class="q">${n}</span>
      <button data-inc="${a.id}" title="Sumar">+</button>

}

function renderItems(){
  const list=allItems().filter(i=>{
    if(ui.iSrc!=="all"&&i.source!==ui.iSrc) return false;
    if(ui.iQ&&!i.name.toLowerCase().includes(ui.iQ)) return false;
    if(ui.iReady&&!(itemGated(i)&&itemReady(i)&&!itemBought(i.id))) return false;
    if(ui.iMissing&&itemBought(i.id)) return false;
    return true;
  });
  const total=allItems().length, done=allItems().filter(i=>itemBought(i.id)).length;
  document.getElementById("itemsCnt").textContent=`${done}/${total} comprados`;
  const el=document.getElementById("itemsBody");
  if(!list.length){ el.innerHTML=`<div class="empty">Nada con estos filtros 🎯</div>`; return; }
  const srcs=[...new Set(list.map(i=>i.source))];
  el.innerHTML=srcs.map(s=>{
    const items=list.filter(i=>i.source===s);
    const d=items.filter(i=>itemBought(i.id)).length;
    return `<section class="group"><h3>${s} <span class="c">${d}/${items.length}</span></h3>${items.map(itemRow).join("")}</section>`;
  }).join("");
}
function itemRow(i){
  const bought=itemBought(i.id), gated=itemGated(i), buyable=itemReady(i);
  const badge=(bought||!gated)?'':buyable?`<span class="badge ready">Listo</span>`:`<span class="badge wait">Faltan piezas</span>`;
  const ings=(i.ingredients||[]).map(g=>{
    let cls='neutral', hint='', attr='';
    if(g.animalId){ const leg=isLeg(g.animalId); const have=leg?obtained(g.animalId):count(g.animalId)>=g.qty; cls=have?'have clk':'clk'; if(!have&&!leg) hint=` <span class="qty">tenés ${count(g.animalId)}</span>`; else if(leg) hint=` <span class="qty">${have?'✓ cazado':'cazá el legendario'}</span>`; attr=` data-animal="${g.animalId}"`; }
    else if(g.category){ cls=(anyObtainedInCat(g.category)?'have ':'')+'clk'; attr=` data-cat="${g.category}"`; }
    return `<span class="chip ${cls}"${attr}${attr?' title="Ver este animal en la lista →"':''}><span class="dot"></span>${g.name}${g.qty>1?` <span class="qty">×${g.qty}</span>`:''}${hint}</span>`;
  }).join("");
  const control=bought
    ? `<span class="badge done">✔ Comprado</span>`
    : `<button class="btn buybtn" data-buy="${i.id}" ${buyable?'':'disabled'} title="${buyable?'Comprar y descontar materiales':'Te faltan materiales'}">Comprar</button>`;
  return `<div class="item ${bought?'bought':''} ${gated&&buyable&&!bought?'ready':''}">
    <div class="main">
      <div class="title">${i.name}</div>
      <div class="subtitle">${i.type||''}${i.cost?` · $${i.cost}`:''}</div>
      ${ings?`<div class="ings">${ings}</div>`:''}
      ${i.note?`<div class="uncertain">ℹ️ ${i.note}</div>`:''}
    </div>
    <div class="side">${badge}${control}</div>
  </div>`;
}

/* ---- visor de mapa (zoom / paneo) ---- */
const mapState={scale:1,tx:0,ty:0,natW:1000,natH:778};
let currentPins=[];
const _wrap=function(){ return document.getElementById("mapWrap"); };
function fitScale(){ const w=_wrap(); return Math.min(w.clientWidth/mapState.natW, w.clientHeight/mapState.natH); }
function clampPan(){
  const w=_wrap(), W=w.clientWidth, H=w.clientHeight, cw=mapState.natW*mapState.scale, ch=mapState.natH*mapState.scale;
  if(cw<=W) mapState.tx=(W-cw)/2; else mapState.tx=Math.max(W-cw,Math.min(0,mapState.tx));
  if(ch<=H) mapState.ty=(H-ch)/2; else mapState.ty=Math.max(H-ch,Math.min(0,mapState.ty));
}
function positionPins(){
  currentPins.forEach(function(p){ if(p.el){ p.el.style.left=(mapState.tx+p.x*mapState.natW*mapState.scale)+"px"; p.el.style.top=(mapState.ty+p.y*mapState.natH*mapState.scale)+"px"; } });
}
function applyMap(){ document.getElementById("mapCanvas").style.transform="translate("+mapState.tx+"px,"+mapState.ty+"px) scale("+mapState.scale+")"; positionPins(); }
function fitMap(){ mapState.scale=fitScale(); clampPan(); applyMap(); }
function framePins(pins){
  const w=_wrap(), W=w.clientWidth, H=w.clientHeight;
  if(!pins.length){ fitMap(); return; }
  let minx=1,miny=1,maxx=0,maxy=0;
  pins.forEach(function(p){ minx=Math.min(minx,p.x); miny=Math.min(miny,p.y); maxx=Math.max(maxx,p.x); maxy=Math.max(maxy,p.y); });
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2, spanX=Math.max(0.14,maxx-minx), spanY=Math.max(0.14,maxy-miny), pad=2.1;
  let s=Math.min(W/(spanX*mapState.natW*pad), H/(spanY*mapState.natH*pad));
  s=Math.max(fitScale(),Math.min(s,3.2));
  mapState.scale=s; mapState.tx=W/2-cx*mapState.natW*s; mapState.ty=H/2-cy*mapState.natH*s; clampPan(); applyMap();
}
function zoomAt(mx,my,f){
  const old=mapState.scale; let ns=Math.max(fitScale()*0.85,Math.min(old*f,6)); const k=ns/old;
  mapState.tx=mx-k*(mx-mapState.tx); mapState.ty=my-k*(my-mapState.ty); mapState.scale=ns; clampPan(); applyMap();
}

  const h=a.habitat||{regions:[],locations:[]};

  const locs=(h.locations||[]).map(function(l){return "<li>"+l+"</li>";}).join("")||"<li>—</li>";
  const extra=a.mapCat?'<a class="mm-open" href="https://rdr2map.com/?catIds='+a.mapCat+'" target="_blank" rel="noopener">Ver zona exacta en rdr2map.com ↗</a>':'';
  document.getElementById("mmInfo").innerHTML=
    '<div class="mm-row"><span class="mm-lbl">Regiones</span><div>'+rlist+'</div></div>'+
    '<div class="mm-row"><span class="mm-lbl">Ubicaciones</span><ul>'+locs+'</ul></div>'+
    (h.time?'<div class="mm-row"><span class="mm-lbl">Horario</span><div>'+h.time+'</div></div>':'')+
    (h.weapon?'<div class="mm-row"><span class="mm-lbl">Arma / método</span><div>'+h.weapon+'</div></div>':'')+
    extra;
  currentPins=animalPins(a);
  const layer=document.getElementById("pinLayer"); layer.innerHTML="";
  currentPins.forEach(function(p){ const el=document.createElement("div"); el.className="pin"; el.innerHTML='<div class="halo"></div><div class="dot"></div><div class="plbl">'+p.label+'</div>'; layer.appendChild(el); p.el=el; });
  document.getElementById("mapModal").classList.add("open");
  requestAnimationFrame(function(){ framePins(currentPins); });
}
function closeMap(){ document.getElementById("mapModal").classList.remove("open"); }

(function initMap(){
  const bm=document.getElementById("baseMap");
  function setNat(){ if(bm.naturalWidth){ mapState.natH=mapState.natW*bm.naturalHeight/bm.naturalWidth; } }
  if(bm.complete) setNat(); else bm.addEventListener("load",setNat);
  const w=_wrap(); let drag=false,sx,sy,stx,sty;
  w.addEventListener("pointerdown",function(e){ if(e.target.closest(".mapzoom"))return; drag=true; w.classList.add("grabbing"); sx=e.clientX; sy=e.clientY; stx=mapState.tx; sty=mapState.ty; try{w.setPointerCapture(e.pointerId);}catch(_){} });
  w.addEventListener("pointermove",function(e){ if(!drag)return; mapState.tx=stx+(e.clientX-sx); mapState.ty=sty+(e.clientY-sy); clampPan(); applyMap(); });
  function end(){ drag=false; w.classList.remove("grabbing"); }
  w.addEventListener("pointerup",end); w.addEventListener("pointercancel",end);
  w.addEventListener("wheel",function(e){ e.preventDefault(); const r=w.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1.18:1/1.18); },{passive:false});
  document.getElementById("mzIn").addEventListener("click",function(){ const q=_wrap(); zoomAt(q.clientWidth/2,q.clientHeight/2,1.35); });
  document.getElementById("mzOut").addEventListener("click",function(){ const q=_wrap(); zoomAt(q.clientWidth/2,q.clientHeight/2,1/1.35); });
  document.getElementById("mzFit").addEventListener("click",fitMap);
})();
document.getElementById("mmClose").addEventListener("click",closeMap);
document.getElementById("mapModal").addEventListener("click",e=>{ if(e.target.id==="mapModal") closeMap(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMap(); });

document.getElementById("animalsBody").addEventListener("click",e=>{
  const mp=e.target.closest("button[data-map]");
  if(mp){ openMap(mp.dataset.map); return; }
  const ct=e.target.closest("button[data-catch]");
  if(ct){ const id=ct.dataset.catch; state.obtained[id]=true; state.animals[id]=1; save(); renderStats(); renderAnimals(); renderItems(); return; }
  const inc=e.target.closest("button[data-inc]"), dec=e.target.closest("button[data-dec]");
  if(inc){ const id=inc.dataset.inc; state.animals[id]=count(id)+1; state.obtained[id]=true; save(); renderStats(); renderAnimals(); renderItems(); }
  else if(dec){ const id=dec.dataset.dec; const v=count(id)-1; if(v<=0) delete state.animals[id]; else state.animals[id]=v; save(); renderStats(); renderAnimals(); renderItems(); }
});
function focusAnimal(id,cat){
  ui.aMissing=false; document.getElementById("aMissing").checked=false;
  let scrollId=id;
  if(id){ const a=animalById(id); if(!a) return; ui.aCat="all"; ui.aQ=a.name.toLowerCase(); document.getElementById("aSearch").value=a.name; }
  else if(cat){ ui.aCat=cat; ui.aQ=""; document.getElementById("aSearch").value=""; }
  else return;
  document.getElementById("aCat").value=ui.aCat;
  renderAnimals();
  requestAnimationFrame(function(){
    const card = scrollId ? document.querySelector('#animalsBody .card[data-id="'+scrollId+'"]') : document.querySelector('#animalsBody .card');
    if(card){ card.scrollIntoView({block:"center",behavior:"smooth"}); card.classList.add("flash"); setTimeout(function(){ card.classList.remove("flash"); },1500); }
    document.getElementById("animalsBody").scrollIntoView({block:"nearest"});
  });
}
document.getElementById("itemsBody").addEventListener("click",e=>{
  const chip=e.target.closest(".chip.clk");
  if(chip){ focusAnimal(chip.dataset.animal, chip.dataset.cat); return; }
  const b=e.target.closest("button[data-buy]"); if(!b) return;
  const id=b.dataset.buy, it=allItems().find(x=>x.id===id);
  if(!it||itemBought(id)||!itemReady(it)) return; // no se puede comprar sin cumplir condiciones
  // descuenta el stock de cada material concreto (irreversible)
  (it.ingredients||[]).forEach(g=>{ if(g.animalId && !isLeg(g.animalId)){ const v=count(g.animalId)-g.qty; if(v<=0) delete state.animals[g.animalId]; else state.animals[g.animalId]=v; } }); // legendarios NO se consumen
  state.items[id]=true; save(); renderStats(); renderAnimals(); renderItems();
});

/* ---------- export / import / reset ---------- */
document.getElementById("btnExport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="rdr2-progreso.json"; a.click();
});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ localStorage.setItem(STORAGE_KEY,r.result); state=loadState(); renderAll(); }catch(err){ alert("Archivo inválido"); } };
  r.readAsText(f);
});
document.getElementById("btnReset").addEventListener("click",()=>{ if(confirm("¿Borrar todo el progreso?")){ state={animals:{},items:{},obtained:{}}; save(); renderAll(); } });

/* ---------- init ---------- */
initAnimalFilter(); initItemFilter(); renderAll();
if(location.hash.indexOf("#map=")===0){ var _mid=decodeURIComponent(location.hash.slice(5)); if(animalById(_mid)) openMap(_mid); }
</script>
